name: Build and Download HTML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装项目依赖
        run: npm install --legacy-peer-deps

      - name: 执行生产打包
        run: npm run build

      - name: 上传构建产物 (dist)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-web-page
          path: dist/
